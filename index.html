<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#182230;--muted:#718096;--line:#e5eaf1;--nav:#111b2c;--accent:#635bff;--accent2:#16a085;--red:#d9485f;--amber:#b7791f;--shadow:0 8px 24px #15233b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#dce5f3;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 22px;border-bottom:1px solid #ffffff1b}.brandmark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#8078ff,#4e46d9);display:grid;place-items:center;font-size:21px;font-weight:900;color:white}.brand strong{font-size:17px;letter-spacing:.4px;color:#fff}.brand small{display:block;color:#9ba9bf;font-size:11px;margin-top:2px}.navlabel{font-size:10px;letter-spacing:1.5px;color:#71819c;margin:22px 12px 8px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;border:0;color:#b9c6d9;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-weight:600;width:100%}.nav button .ico{width:20px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:#29354a;color:white}.sidebar-foot{margin-top:28px;padding:13px;border:1px solid #ffffff1a;border-radius:12px;color:#aebbd0;font-size:12px}.sidebar-foot b{color:#fff;display:block;margin-bottom:4px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px;position:sticky;top:0;z-index:5}.top-left{display:flex;align-items:center;gap:14px}.hamb{display:none}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:3px}.page-title{font-size:21px;font-weight:800;letter-spacing:-.4px}.top-actions{display:flex;align-items:center;gap:10px}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:8px 12px;background:#edf9f5;color:#11765f;font-weight:700;font-size:12px}.dot{width:7px;height:7px;background:#16a085;border-radius:50%}.select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink);max-width:190px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e9e7ff;color:#5147db;font-weight:800}.content{padding:27px 30px 50px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:23px}.welcome h1{font-size:26px;letter-spacing:-.8px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.dark{background:#182230;color:white;border-color:#182230}.btn.green{background:#13856d;color:white;border-color:#13856d}.btn.danger{color:var(--red);border-color:#f5c8cf;background:#fff}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700}.stat-icon{width:36px;height:36px;border-radius:11px;background:#f0efff;display:grid;place-items:center;font-size:17px}.stat-value{font-size:27px;font-weight:850;letter-spacing:-.8px;margin:15px 0 4px}.stat-note{font-size:11px;color:var(--muted)}.positive{color:#13856d}.negative{color:var(--red)}.cols{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.card-head h3{margin:0;font-size:15px}.card-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;font-size:11px;letter-spacing:.3px;color:var(--muted);font-weight:800;padding:11px 10px;background:#f8f9fc;white-space:nowrap}td{padding:13px 10px;border-bottom:1px solid #eef1f5;font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}.product-name{font-weight:750}.sub{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badge{padding:5px 8px;border-radius:30px;background:#eaf8f3;color:#11765f;font-size:10px;font-weight:800;display:inline-block}.badge.warn{background:#fff4dc;color:#a46700}.badge.red{background:#ffeaed;color:#bf344a}.list{display:grid;gap:12px}.listitem{display:flex;align-items:center;gap:11px}.miniicon{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#f0f3f8;font-size:18px;flex-shrink:0}.listitem .meta{flex:1;min-width:0}.listitem b{display:block;font-size:12px}.listitem small{color:var(--muted);font-size:11px}.listitem strong{font-size:12px}.bar{height:7px;background:#edf0f5;border-radius:10px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--accent);border-radius:10px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:19px;flex-wrap:wrap}.sectionhead h1{font-size:24px;margin:0;letter-spacing:-.7px}.sectionhead p{color:var(--muted);margin:5px 0 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 12px;min-width:200px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750;color:#4b586a}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ec;border-radius:9px;padding:11px 12px;background:#fff;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8a83ff;box-shadow:0 0 0 3px #635bff15}.field.full{grid-column:1/-1}.muted{color:var(--muted)}.empty{padding:35px 10px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.actions{display:flex;gap:6px}.modalback{position:fixed;inset:0;background:#0c1424a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:23px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 5px;font-size:20px}.modal .intro{color:var(--muted);margin:0 0 19px;font-size:12px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;background:#172235;color:#fff;padding:13px 17px;border-radius:11px;z-index:40;box-shadow:var(--shadow);max-width:90vw}.toast.error{background:#a92d42}.salegrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:16px}.cartrow{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:7px}.totals{display:grid;gap:9px;margin-top:16px}.totalrow{display:flex;justify-content:space-between;color:var(--muted)}.totalrow.final{font-size:18px;font-weight:850;color:var(--ink);border-top:1px solid var(--line);padding-top:13px}.notice{border:1px solid #d7e7ff;background:#f0f6ff;padding:12px 14px;border-radius:11px;color:#365c91;font-size:12px;margin-bottom:17px}.mobileonly{display:none}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#e4e3ff,transparent 40%),#f4f6fa}.login-card{width:min(460px,100%);background:white;border:1px solid var(--line);padding:30px;border-radius:20px;box-shadow:0 20px 60px #1d2c4c12}.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:25px}.login-card h1{margin:0 0 7px;font-size:25px}.login-card p{color:var(--muted);margin:0 0 23px}.login-card .field{margin-bottom:13px}.smallnote{font-size:11px;color:var(--muted);line-height:1.5}.linkbtn{border:0;background:none;color:var(--accent);font-weight:800;padding:8px 0}.syncstate{font-size:11px;color:var(--muted);margin-top:8px}.settingsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shopcard{display:flex;align-items:center;gap:13px}.shoplogo{width:48px;height:48px;border-radius:14px;background:#eeedff;color:#554be2;display:grid;place-items:center;font-size:22px}.shopcard .meta{flex:1}.shopcard h3{margin:0 0 4px;font-size:14px}.shopcard p{margin:0;color:var(--muted);font-size:12px}
@media(max-width:1050px){.layout{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:720px){.layout{display:block}.sidebar{position:fixed;left:-270px;top:0;width:250px;z-index:30;transition:left .2s}.sidebar.open{left:0;box-shadow:15px 0 50px #0004}.hamb{display:inline-flex}.topbar{height:66px;padding:0 14px}.page-title{font-size:17px}.top-actions .pill{display:none}.content{padding:19px 13px 35px}.welcome{align-items:flex-start}.welcome h1{font-size:22px}.stats{gap:10px}.card{padding:14px;border-radius:13px}.stat-value{font-size:21px}.stat-icon{width:30px;height:30px}.salegrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.settingsgrid{grid-template-columns:1fr}.select{max-width:135px}.top-actions{gap:6px}.avatar{display:none}.mobileonly{display:inline-flex}.sectionhead h1{font-size:22px}.search{min-width:0;flex:1}.toolbar{width:100%}.toolbar .search{width:100%}}
</style></head>
<body>
<div id="app"><div class="login-wrap"><div class="login-card"><div class="login-logo"><div class="brandmark">N</div><div><strong>GESCOM NOVA</strong><small class="muted" style="display:block">Gestion multiboutique professionnelle</small></div></div><h1>Chargement sécurisé…</h1><p>Initialisation de votre espace de gestion.</p></div></div></div>
<div id="modalback" class="modalback" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(n)||0)+' FCFA';
const now=()=>new Date().toISOString(); const today=()=>new Date().toISOString().slice(0,10); const uid=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
const defaultDB=()=>({version:1,tenantId:uid(),company:{name:'Mon entreprise',owner:'Administrateur',phone:'',currency:'XOF'},shops:[{id:'shop-main',name:'Boutique principale',location:'Dakar',phone:'',active:true,createdAt:now()}],users:[{id:'user-owner',name:'Administrateur',email:'admin@gescom.local',password:'admin123',role:'Propriétaire',shopId:'all',active:true}],currentUserId:'user-owner',currentShopId:'shop-main',products:[],clients:[],suppliers:[],sales:[],purchases:[],cash:[],transfers:[],audit:[],lastSync:null,apiUrl:''});
let db,activePage='dashboard',cart=[],editing=null,searchTerm='',toastTimer=null,showLogin=false;
function safeLoad(){try{const raw=localStorage.getItem('GESCOM_NOVA_PRO');if(raw){const d=JSON.parse(raw);const base=defaultDB();return {...base,...d,tenantId:d.tenantId||base.tenantId,company:{...base.company,...(d.company||{})},shops:Array.isArray(d.shops)?d.shops:base.shops,users:Array.isArray(d.users)?d.users:base.users,products:Array.isArray(d.products)?d.products:[],clients:Array.isArray(d.clients)?d.clients:[],suppliers:Array.isArray(d.suppliers)?d.suppliers:[],sales:Array.isArray(d.sales)?d.sales:[],purchases:Array.isArray(d.purchases)?d.purchases:[],cash:Array.isArray(d.cash)?d.cash:[],transfers:Array.isArray(d.transfers)?d.transfers:[],audit:Array.isArray(d.audit)?d.audit:[]};}}catch(e){console.warn('Local storage inaccessible',e)}return defaultDB()}
function save(){try{localStorage.setItem('GESCOM_NOVA_PRO',JSON.stringify(db));return true}catch(e){toast('Enregistrement local impossible : espace ou permissions du navigateur.',true);return false}}
function currentUser(){return db.users.find(u=>u.id===db.currentUserId)||db.users[0]}
function currentShop(){return db.shops.find(s=>s.id===db.currentShopId)||db.shops[0]}
function isOwner(){return ['Propriétaire','Administrateur'].includes(currentUser()?.role)}
function allowedShop(id){return isOwner()||currentUser()?.shopId==='all'||currentUser()?.shopId===id}
function visibleShops(){return db.shops.filter(s=>allowedShop(s.id)&&s.active!==false)}
function scoped(items){return items.filter(x=>x.shopId===db.currentShopId||isOwner()&&db.currentShopId==='all')}
function audit(action,detail=''){db.audit.unshift({id:uid(),at:now(),user:currentUser()?.name||'Utilisateur',shop:currentShop()?.name||'Toutes boutiques',action,detail});db.audit=db.audit.slice(0,500);save()}
function toast(msg,error=false){const el=$('toast');el.textContent=msg;el.className='toast'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function modal(title,desc,body,footer=''){ $('modal').innerHTML=`<h2>${title}</h2><p class="intro">${desc||''}</p>${body}<div class="modalfoot">${footer||'<button class="btn" data-close>Fermer</button>'}</div>`;$('modalback').classList.add('show');$('modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);$('modal').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('modalback').onclick=e=>{if(e.target===$('modalback'))closeModal()}}
function closeModal(){$('modalback').classList.remove('show');editing=null}
function input(name,label,value='',type='text',required=false,extra=''){return `<div class="field"><label for="f_${name}">${label}${required?' *':''}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}
function select(name,label,options,value=''){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
function getForm(){const out={};$('modal').querySelectorAll('[name]').forEach(el=>out[el.name]=el.value.trim());return out}
const navGroups=[['PILOTAGE',[['dashboard','▦','Tableau de bord'],['sales','↗','Ventes & caisse'],['reports','▥','Rapports & bénéfices']]],['GESTION COMMERCIALE',[['products','◇','Articles & stock'],['purchases','⇩','Achats fournisseurs'],['clients','♙','Clients'],['suppliers','▤','Fournisseurs']]],['RÉSEAU MULTIBOUTIQUE',[['shops','⌂','Mes boutiques'],['transfers','⇄','Transferts de stock'],['users','♧','Utilisateurs & accès']]],['ADMINISTRATION',[['cash','◉','Mouvements de caisse'],['sync','⟳','Cloud & synchronisation'],['settings','⚙','Paramètres'],['history','≡','Journal d’activité']]]];
const titles={dashboard:'Tableau de bord',sales:'Ventes & caisse',reports:'Rapports & bénéfices',products:'Articles & stock',purchases:'Achats fournisseurs',clients:'Clients',suppliers:'Fournisseurs',shops:'Mes boutiques',transfers:'Transferts de stock',users:'Utilisateurs & accès',cash:'Mouvements de caisse',sync:'Cloud & synchronisation',settings:'Paramètres',history:'Journal d’activité'};
function shell(){const shopOptions=[{value:'all',label:'Toutes les boutiques'},...visibleShops().map(s=>({value:s.id,label:s.name}))];if(!isOwner()||!db.shops.some(s=>s.id===db.currentShopId))db.currentShopId=currentUser()?.shopId!=='all'?currentUser().shopId:(db.shops[0]?.id||'shop-main');$('app').innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">N</div><div><strong>GESCOM NOVA</strong><small>PRO • MULTIBOUTIQUE</small></div></div>${navGroups.map((g,i)=>`<div class="navlabel">${g[0]}</div><div class="nav">${g[1].filter(([id])=>isOwner()||!['shops','transfers','users','sync','settings','history','reports'].includes(id)).map(([id,ico,label])=>`<button class="${activePage===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`).join('')}</div>`).join('')}<div class="sidebar-foot"><b>${esc(db.company.name)}</b>${esc(currentUser()?.name)} · ${esc(currentUser()?.role)}<br><span>Mode local sécurisé</span></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="btn hamb" id="hamb">☰</button><div><div class="eyebrow">ESPACE DE GESTION / ${esc(db.company.name.toUpperCase())}</div><div class="page-title">${titles[activePage]||'GESCOM NOVA'}</div></div></div><div class="top-actions"><span class="pill"><span class="dot"></span> Données enregistrées</span><select class="select" id="shopSwitch" aria-label="Choisir une boutique">${shopOptions.map(o=>`<option value="${esc(o.value)}" ${o.value===db.currentShopId?'selected':''}>${esc(o.label)}</option>`).join('')}</select><div class="avatar">${esc((currentUser()?.name||'A').slice(0,1).toUpperCase())}</div><button class="btn small" id="logout">Sortir</button></div></header><div class="content" id="pagecontent"></div></main></div>`;
$('app').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{activePage=b.dataset.page;searchTerm='';shell();renderPage();$('sidebar').classList.remove('open')});$('hamb').onclick=()=>$('sidebar').classList.toggle('open');$('shopSwitch').onchange=e=>{db.currentShopId=e.target.value;save();shell();renderPage()};$('logout').onclick=()=>{showLogin=true;renderLogin()};renderPage()}
function pageHead(title,sub,actions=''){return `<div class="sectionhead"><div><h1>${title}</h1><p>${sub}</p></div><div class="toolbar">${actions}</div></div>`}
function btn(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`}
function productsForShop(shopId=db.currentShopId){return shopId==='all'&&isOwner()?db.products:db.products.filter(p=>p.shopId===shopId)}function stockQty(p){return Number(p.stock)||0}function saleTotal(s){return Number(s.total)||0}function salesScope(){return db.sales.filter(s=>db.currentShopId==='all'&&isOwner()||s.shopId===db.currentShopId)}
function renderPage(){try{const el=$('pagecontent');if(!el)return;const pages={dashboard:renderDashboard,products:renderProducts,sales:renderSales,purchases:renderPurchases,clients:renderClients,suppliers:renderSuppliers,shops:renderShops,transfers:renderTransfers,users:renderUsers,cash:renderCash,reports:renderReports,sync:renderSync,settings:renderSettings,history:renderHistory};el.innerHTML=(pages[activePage]||renderDashboard)();wirePage()}catch(e){console.error(e);$('pagecontent').innerHTML=`<div class="card"><h2>Une erreur est survenue</h2><p class="muted">${esc(e.message||e)}</p><button class="btn primary" id="recover">Recharger le module</button></div>`;$('recover').onclick=renderPage}}
function renderDashboard(){const ss=salesScope(),tod=ss.filter(s=>(s.date||'').slice(0,10)===today()),rev=tod.reduce((a,s)=>a+saleTotal(s),0),cost=productsForShop().reduce((a,p)=>a+stockQty(p)*Number(p.buyPrice||0),0),low=db.products.filter(p=>(db.currentShopId==='all'&&isOwner()||p.shopId===db.currentShopId)&&stockQty(p)<=Number(p.alertAt||5));const recent=ss.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);return `<div class="welcome"><div><h1>Bonjour ${esc(currentUser()?.name?.split(' ')[0]||'')}, bienvenue 👋</h1><p>Voici la situation commerciale de ${esc(db.currentShopId==='all'?'votre réseau':currentShop()?.name||'votre boutique')}.</p></div><div class="toolbar">${btn('＋ Nouvelle vente','new-sale','primary')}${btn('＋ Ajouter un article','new-product')}</div></div><div class="grid stats"><div class="card"><div class="stat-top">CHIFFRE D’AFFAIRES DU JOUR <span class="stat-icon">↗</span></div><div class="stat-value">${money(rev)}</div><div class="stat-note">${tod.length} vente(s) aujourd’hui</div></div><div class="card"><div class="stat-top">VENTES ENREGISTRÉES <span class="stat-icon">▤</span></div><div class="stat-value">${ss.length}</div><div class="stat-note">Historique de la sélection</div></div><div class="card"><div class="stat-top">RÉFÉRENCES ARTICLES <span class="stat-icon">◇</span></div><div class="stat-value">${productsForShop().length}</div><div class="stat-note">${low.length} sous le seuil d’alerte</div></div><div class="card"><div class="stat-top">VALEUR DU STOCK <span class="stat-icon">▦</span></div><div class="stat-value">${money(cost)}</div><div class="stat-note">Sur la boutique sélectionnée</div></div></div><div class="grid cols"><div class="card"><div class="card-head"><div><h3>Dernières ventes</h3><p>Suivi récent des transactions</p></div>${btn('Voir toutes','sales','small')}</div>${recent.length?`<div class="tablewrap"><table><thead><tr><th>RÉFÉRENCE</th><th>CLIENT</th><th>DATE</th><th>MONTANT</th><th>STATUT</th></tr></thead><tbody>${recent.map(s=>`<tr><td class="product-name">${esc(s.ref)}</td><td>${esc(s.clientName||'Client comptoir')}</td><td>${esc((s.date||'').slice(0,10))}</td><td><b>${money(s.total)}</b></td><td><span class="badge">${esc(s.status||'Payée')}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucune vente pour le moment</b>Enregistrez une vente pour voir apparaître vos résultats.</div>`}</div><div class="card"><div class="card-head"><div><h3>Alertes de stock</h3><p>Articles à surveiller</p></div><span class="badge ${low.length?'warn':''}">${low.length} alerte(s)</span></div><div class="list">${low.slice(0,7).map(p=>`<div class="listitem"><div class="miniicon">📦</div><div class="meta"><b>${esc(p.name)}</b><small>${esc(p.sku||'Sans référence')}</small></div><span class="badge ${stockQty(p)===0?'red':'warn'}">${stockQty(p)} en stock</span></div>`).join('')||'<div class="empty">Aucune alerte de stock.</div>'}</div><div style="margin-top:17px">${btn('Gérer les stocks','products','small')}</div></div></div>`}
function tablePage({title,sub,actions,headers,rows,empty,search=true}){return `${pageHead(title,sub,actions)}${search?`<div style="margin-bottom:13px"><input class="search" id="tableSearch" placeholder="Rechercher dans la liste…" value="${esc(searchTerm)}"></div>`:''}<div class="card"><div class="tablewrap">${rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="dataRows">${rows.join('')}</tbody></table>`:`<div class="empty"><b>${empty||'Aucune donnée enregistrée'}</b>Utilisez le bouton d’ajout pour commencer.</div>`}</div></div>`}
function renderProducts(){const arr=productsForShop();const rows=arr.filter(p=>JSON.stringify(p).toLowerCase().includes(searchTerm.toLowerCase())).map(p=>`<tr><td><span class="product-name">${esc(p.name)}</span><span class="sub">${esc(p.sku||'Sans référence')} · ${esc(p.category||'Divers')}</span></td><td>${money(p.buyPrice)}</td><td><b>${money(p.sellPrice)}</b></td><td>${stockQty(p)}</td><td><span class="badge ${stockQty(p)===0?'red':stockQty(p)<=Number(p.alertAt||5)?'warn':''}">${stockQty(p)===0?'Rupture':stockQty(p)<=Number(p.alertAt||5)?'Stock bas':'Disponible'}</span></td><td><div class="actions"><button class="btn small" data-edit-product="${p.id}">Modifier</button><button class="btn small danger" data-del-product="${p.id}">×</button></div></td></tr>`);return tablePage({title:'Articles & stock',sub:'Catalogue, prix de vente, coût d’achat et niveaux de stock.',actions:btn('＋ Nouvel article','new-product','primary'),headers:['ARTICLE / RÉFÉRENCE','COÛT D’ACHAT','PRIX DE VENTE','STOCK','ÉTAT','ACTIONS'],rows,empty:'Votre catalogue est vide'})}
function renderClients(){const rows=db.clients.filter(x=>(db.currentShopId==='all'||x.shopId===db.currentShopId)&&JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase())).map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.address||'—')}</td><td>${money(c.balance||0)}</td><td><button class="btn small danger" data-del-client="${c.id}">Supprimer</button></td></tr>`);return tablePage({title:'Clients',sub:'Fichier clients, contacts et suivi des soldes.',actions:btn('＋ Nouveau client','new-client','primary'),headers:['NOM','TÉLÉPHONE','E-MAIL','ADRESSE','SOLDE','ACTIONS'],rows,empty:'Aucun client enregistré'})}
function renderSuppliers(){const rows=db.suppliers.filter(x=>(db.currentShopId==='all'||x.shopId===db.currentShopId)&&JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase())).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.phone||'—')}</td><td>${esc(s.email||'—')}</td><td>${esc(s.address||'—')}</td><td><button class="btn small danger" data-del-supplier="${s.id}">Supprimer</button></td></tr>`);return tablePage({title:'Fournisseurs',sub:'Répertoire de vos fournisseurs et contacts.',actions:btn('＋ Nouveau fournisseur','new-supplier','primary'),headers:['FOURNISSEUR','TÉLÉPHONE','E-MAIL','ADRESSE','ACTIONS'],rows,empty:'Aucun fournisseur enregistré'})}
function renderSales(){const ss=salesScope().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));const rows=ss.filter(s=>JSON.stringify(s).toLowerCase().includes(searchTerm.toLowerCase())).map(s=>`<tr><td><b>${esc(s.ref)}</b><span class="sub">${(s.items||[]).length} article(s)</span></td><td>${esc(s.clientName||'Client comptoir')}</td><td>${esc((s.date||'').replace('T',' ').slice(0,16))}</td><td><b>${money(s.total)}</b></td><td>${esc(s.payment||'Espèces')}</td><td><span class="badge">${esc(s.status||'Payée')}</span></td><td><button class="btn small" data-invoice="${s.id}">Facture</button></td></tr>`);return `${pageHead('Ventes & caisse','Encaissement multi-articles, facture et déduction automatique du stock.',btn('＋ Nouvelle vente','new-sale','primary'))}<div class="grid stats"><div class="card"><div class="stat-top">TOTAL DES VENTES</div><div class="stat-value">${money(ss.reduce((a,s)=>a+saleTotal(s),0))}</div><div class="stat-note">Sur la période affichée</div></div><div class="card"><div class="stat-top">TRANSACTIONS</div><div class="stat-value">${ss.length}</div><div class="stat-note">Ventes enregistrées</div></div><div class="card"><div class="stat-top">ARTICLES VENDUS</div><div class="stat-value">${ss.reduce((a,s)=>a+(s.items||[]).reduce((n,i)=>n+Number(i.qty||0),0),0)}</div><div class="stat-note">Quantité totale</div></div><div class="card"><div class="stat-top">MODE HORS LIGNE</div><div class="stat-value">Actif</div><div class="stat-note">Les données sont enregistrées sur cet appareil</div></div></div><div style="margin-bottom:13px"><input class="search" id="tableSearch" placeholder="Rechercher une vente…" value="${esc(searchTerm)}"></div><div class="card"><div class="tablewrap">${rows.length?`<table><thead><tr><th>RÉFÉRENCE</th><th>CLIENT</th><th>DATE</th><th>TOTAL</th><th>PAIEMENT</th><th>STATUT</th><th>DOCUMENT</th></tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty"><b>Aucune vente</b>Créez une vente pour enregistrer plusieurs articles sur la même facture.</div>'}</div></div>`}
function renderPurchases(){const arr=db.purchases.filter(p=>db.currentShopId==='all'&&isOwner()||p.shopId===db.currentShopId).slice().reverse();const rows=arr.filter(p=>JSON.stringify(p).toLowerCase().includes(searchTerm.toLowerCase())).map(p=>`<tr><td><b>${esc(p.ref)}</b></td><td>${esc(p.supplierName)}</td><td>${esc((p.date||'').slice(0,10))}</td><td>${(p.items||[]).length} article(s)</td><td><b>${money(p.total)}</b></td><td><button class="btn small danger" data-del-purchase="${p.id}">Annuler</button></td></tr>`);return tablePage({title:'Achats fournisseurs',sub:'Entrées de stock et suivi des commandes fournisseurs.',actions:btn('＋ Enregistrer un achat','new-purchase','primary'),headers:['RÉFÉRENCE','FOURNISSEUR','DATE','LIGNES','TOTAL','ACTIONS'],rows,empty:'Aucun achat enregistré'})}
function renderShops(){const rows=db.shops.map(s=>`<tr><td><b>${esc(s.name)}</b><span class="sub">${esc(s.id)}</span></td><td>${esc(s.location||'—')}</td><td>${esc(s.phone||'—')}</td><td>${db.products.filter(p=>p.shopId===s.id).length}</td><td>${db.sales.filter(x=>x.shopId===s.id).length}</td><td><span class="badge ${s.active===false?'red':''}">${s.active===false?'Inactive':'Active'}</span></td><td><button class="btn small" data-edit-shop="${s.id}">Modifier</button></td></tr>`);return tablePage({title:'Mes boutiques',sub:'Gérez plusieurs points de vente et consultez leurs activités séparément.',actions:btn('＋ Ajouter une boutique','new-shop','primary'),headers:['BOUTIQUE','VILLE / ZONE','TÉLÉPHONE','RÉFÉRENCES','VENTES','STATUT','ACTIONS'],rows,empty:'Ajoutez votre première boutique',search:false})}
function renderTransfers(){const arr=db.transfers.slice().reverse();const rows=arr.map(t=>`<tr><td><b>${esc(t.ref)}</b></td><td>${esc(db.shops.find(s=>s.id===t.fromShop)?.name||'Boutique supprimée')}</td><td>${esc(db.shops.find(s=>s.id===t.toShop)?.name||'Boutique supprimée')}</td><td>${esc(t.productName)} × ${t.qty}</td><td>${esc((t.date||'').slice(0,10))}</td><td><span class="badge">${esc(t.status||'Transféré')}</span></td></tr>`);return tablePage({title:'Transferts de stock',sub:'Déplacez des articles entre boutiques avec une trace de chaque mouvement.',actions:btn('⇄ Nouveau transfert','new-transfer','primary'),headers:['RÉFÉRENCE','DEPUIS','VERS','ARTICLE / QTÉ','DATE','STATUT'],rows,empty:'Aucun transfert de stock',search:false})}
function renderUsers(){const rows=db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><span class="sub">${esc(u.email)}</span></td><td>${esc(u.role)}</td><td>${esc(u.shopId==='all'?'Toutes les boutiques':db.shops.find(s=>s.id===u.shopId)?.name||'—')}</td><td><span class="badge ${u.active===false?'red':''}">${u.active===false?'Désactivé':'Actif'}</span></td><td>${u.id==='user-owner'?'Compte principal':`<button class="btn small" data-toggle-user="${u.id}">${u.active===false?'Activer':'Désactiver'}</button>`}</td></tr>`);return tablePage({title:'Utilisateurs & accès',sub:'Comptes locaux avec rôle et affectation par boutique.',actions:btn('＋ Créer un utilisateur','new-user','primary'),headers:['UTILISATEUR','RÔLE','BOUTIQUE','STATUT','ACTIONS'],rows,empty:'Aucun utilisateur',search:false})}
function renderCash(){const arr=db.cash.filter(c=>db.currentShopId==='all'&&isOwner()||c.shopId===db.currentShopId).slice().reverse();const balance=arr.reduce((a,c)=>a+(c.type==='Entrée'?Number(c.amount):-Number(c.amount)),0);const rows=arr.map(c=>`<tr><td>${esc((c.date||'').replace('T',' ').slice(0,16))}</td><td><span class="badge ${c.type==='Entrée'?'':'warn'}">${esc(c.type)}</span></td><td>${esc(c.label)}</td><td>${esc(c.method||'Espèces')}</td><td><b>${money(c.amount)}</b></td></tr>`);return `${pageHead('Mouvements de caisse','Suivi des entrées et sorties d’argent.',btn('＋ Nouveau mouvement','new-cash','primary'))}<div class="grid stats"><div class="card"><div class="stat-top">SOLDE NET DES MOUVEMENTS</div><div class="stat-value">${money(balance)}</div><div class="stat-note">Basé sur les mouvements saisis ici</div></div><div class="card"><div class="stat-top">ENTRÉES</div><div class="stat-value">${money(arr.filter(c=>c.type==='Entrée').reduce((a,c)=>a+Number(c.amount),0))}</div></div><div class="card"><div class="stat-top">SORTIES</div><div class="stat-value">${money(arr.filter(c=>c.type==='Sortie').reduce((a,c)=>a+Number(c.amount),0))}</div></div></div><div class="card"><div class="tablewrap">${rows.length?`<table><thead><tr><th>DATE</th><th>TYPE</th><th>MOTIF</th><th>MODE</th><th>MONTANT</th></tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty"><b>Aucun mouvement</b>Ajoutez les entrées ou sorties de caisse.</div>'}</div></div>`}
function renderReports(){const arr=salesScope(),rev=arr.reduce((a,s)=>a+Number(s.total||0),0),cost=arr.reduce((a,s)=>a+(s.items||[]).reduce((n,i)=>n+Number(i.buyPrice||0)*Number(i.qty||0),0),0),profit=rev-cost;const byShop=db.shops.map(s=>{const a=db.sales.filter(x=>x.shopId===s.id);return {s,total:a.reduce((n,x)=>n+Number(x.total||0),0),count:a.length}});return `${pageHead('Rapports & bénéfices','Indicateurs calculés à partir des ventes et des coûts enregistrés.',btn('Exporter CSV','export-csv'))}<div class="grid stats"><div class="card"><div class="stat-top">CHIFFRE D’AFFAIRES</div><div class="stat-value">${money(rev)}</div><div class="stat-note">Toutes ventes du périmètre</div></div><div class="card"><div class="stat-top">COÛT DES ARTICLES VENDUS</div><div class="stat-value">${money(cost)}</div><div class="stat-note">Selon le coût enregistré sur chaque vente</div></div><div class="card"><div class="stat-top">MARGE BRUTE ESTIMÉE</div><div class="stat-value ${profit<0?'negative':'positive'}">${money(profit)}</div><div class="stat-note">Hors charges, impôts et frais externes</div></div><div class="card"><div class="stat-top">NOMBRE DE VENTES</div><div class="stat-value">${arr.length}</div><div class="stat-note">Transactions enregistrées</div></div></div><div class="card"><div class="card-head"><div><h3>Performance par boutique</h3><p>Chiffre d’affaires cumulé</p></div></div><div class="list">${byShop.map(x=>`<div><div class="listitem"><div class="miniicon">⌂</div><div class="meta"><b>${esc(x.s.name)}</b><small>${x.count} vente(s)</small></div><strong>${money(x.total)}</strong></div><div class="bar"><span style="width:${rev?Math.min(100,x.total/Math.max(...byShop.map(z=>z.total),1)*100):0}%"></span></div></div>`).join('')}</div><p class="smallnote" style="margin-top:18px">Note : ces rapports sont des indicateurs de gestion, pas une comptabilité certifiée. Vérifiez les charges, remboursements et taxes séparément.</p></div>`}
function renderSync(){return `${pageHead('Cloud & synchronisation','Préparez la connexion entre vos appareils, boutiques et base de données centrale.')}<div class="notice"><b>Important :</b> les données fonctionnent localement sur cet appareil. La synchronisation Internet sera active après déploiement du backend et configuration de Neon. Ne considérez pas les données comme synchronisées tant que le test n’est pas réussi.</div><div class="grid settingsgrid"><div class="card"><div class="card-head"><div><h3>Connexion API Cloudflare</h3><p>Adresse du backend déployé</p></div><span class="badge warn">À configurer</span></div><div class="field"><label for="apiUrl">URL de l’API</label><input id="apiUrl" placeholder="https://votre-site.pages.dev/api" value="${esc(db.apiUrl||'')}"></div><div class="field" style="margin-top:10px"><label for="tenantId">Identifiant de l’entreprise (à conserver sur tous les appareils)</label><input id="tenantId" value="${esc(db.tenantId||'')}"></div><div class="toolbar" style="margin-top:12px">${btn('Enregistrer la configuration','save-api','primary')}${btn('Tester la connexion','test-api')}${btn('Envoyer vers le cloud','push-sync','green')}${btn('Restaurer depuis le cloud','pull-sync')}</div><div class="syncstate" id="syncResult">Dernière synchronisation : ${db.lastSync?esc(db.lastSync):'jamais'}</div></div><div class="card"><div class="card-head"><div><h3>État des données</h3><p>Ce navigateur / cet appareil</p></div><span class="badge">Local</span></div><div class="list"><div class="listitem"><div class="miniicon">◇</div><div class="meta"><b>Articles</b><small>Enregistrements locaux</small></div><strong>${db.products.length}</strong></div><div class="listitem"><div class="miniicon">↗</div><div class="meta"><b>Ventes</b><small>Transactions locales</small></div><strong>${db.sales.length}</strong></div><div class="listitem"><div class="miniicon">⌂</div><div class="meta"><b>Boutiques</b><small>Points de vente</small></div><strong>${db.shops.length}</strong></div></div><div style="margin-top:18px">${btn('Exporter une sauvegarde JSON','backup','')}</div></div></div><div class="card" style="margin-top:16px"><h3>Architecture prévue</h3><p class="muted">GitHub pour le code source → Cloudflare Pages/Functions pour l’application et l’API → Neon PostgreSQL pour la base de données partagée. Configurez <code>DATABASE_URL</code> dans les variables d’environnement Cloudflare. Chaque utilisateur doit être authentifié côté serveur avant toute mise en production avec des données clients réelles.</p></div>`}
function renderSettings(){return `${pageHead('Paramètres','Personnalisez votre entreprise, les seuils de stock et la sauvegarde.',btn('Enregistrer les paramètres','save-settings','primary'))}<div class="grid settingsgrid"><div class="card"><div class="card-head"><div><h3>Identité de l’entreprise</h3><p>Informations affichées dans l’espace</p></div></div><div class="formgrid">${input('companyName','Nom de l’entreprise',db.company.name,'text',true)}${input('owner','Responsable',db.company.owner)}${input('phone','Téléphone',db.company.phone)}${select('currency','Devise',[{value:'XOF',label:'Franc CFA (FCFA)'},{value:'GNF',label:'Franc guinéen (GNF)'}],db.company.currency)}</div></div><div class="card"><div class="card-head"><div><h3>Sauvegarde & sécurité</h3><p>Exportez ou restaurez vos données locales</p></div></div><div class="list"><div class="listitem"><div class="miniicon">⬇</div><div class="meta"><b>Exporter la sauvegarde</b><small>Fichier JSON complet</small></div>${btn('Exporter','backup','small')}</div><div class="listitem"><div class="miniicon">⬆</div><div class="meta"><b>Restaurer une sauvegarde</b><small>Remplace les données locales</small></div><button class="btn small" id="restoreBtn">Importer</button></div><div class="listitem"><div class="miniicon">⌫</div><div class="meta"><b>Réinitialiser les données</b><small>Action irréversible sur cet appareil</small></div>${btn('Réinitialiser','reset-data','small danger')}</div></div><input type="file" id="restoreFile" accept="application/json,.json" class="hidden"></div></div><p class="smallnote" style="margin-top:14px">La protection par rôle dans cette version organise l’interface locale. Avant une utilisation commerciale multi-utilisateur sur Internet, l’authentification et les autorisations doivent être imposées par le backend, pas seulement par le navigateur.</p>`}
function renderHistory(){const rows=db.audit.filter(a=>JSON.stringify(a).toLowerCase().includes(searchTerm.toLowerCase())).slice(0,200).map(a=>`<tr><td>${esc((a.at||'').replace('T',' ').slice(0,16))}</td><td>${esc(a.user)}</td><td>${esc(a.shop)}</td><td><b>${esc(a.action)}</b><span class="sub">${esc(a.detail)}</span></td></tr>`);return tablePage({title:'Journal d’activité',sub:'Historique local des principales opérations.',headers:['DATE','UTILISATEUR','BOUTIQUE','ACTION / DÉTAIL'],rows,empty:'Aucune activité enregistrée'})}
function openProduct(p={}){editing=p.id||null;modal(p.id?'Modifier un article':'Nouvel article','Les modifications de stock sont enregistrées dans la boutique sélectionnée.',`<form id="productForm" class="formgrid">${input('name','Désignation',p.name||'','text',true)}${input('sku','Référence / code-barres',p.sku||'')}${input('category','Catégorie',p.category||'Habillement')}${input('buyPrice','Prix d’achat (FCFA)',p.buyPrice??'','number',true,'min="0" step="1"')}${input('sellPrice','Prix de vente (FCFA)',p.sellPrice??'','number',true,'min="0" step="1"')}${input('stock','Stock actuel',p.stock??0,'number',true,'min="0" step="1"')}${input('alertAt','Seuil d’alerte',p.alertAt??5,'number',true,'min="0" step="1"')}</form>`,`${btn('Annuler','close-modal')}${btn('Enregistrer l’article','save-product','primary')}`)}
function openContact(type,p={}){editing=p.id||null;const isClient=type==='client',label=isClient?'client':'fournisseur';modal((p.id?'Modifier ':'Nouveau ')+label,'Les informations sont rattachées à la boutique sélectionnée.',`<form id="contactForm" class="formgrid">${input('name','Nom / raison sociale',p.name||'','text',true)}${input('phone','Téléphone',p.phone||'')}${input('email','E-mail',p.email||'','email')}${input('address','Adresse',p.address||'')}${isClient?input('balance','Solde client (FCFA)',p.balance||0,'number'):''}</form>`,`${btn('Annuler','close-modal')}${btn('Enregistrer','save-'+label,'primary')}`)}
function openShop(s={}){editing=s.id||null;modal(s.id?'Modifier la boutique':'Ajouter une boutique','Chaque boutique conserve son propre stock et ses ventes.',`<form id="shopForm" class="formgrid">${input('name','Nom de la boutique',s.name||'','text',true)}${input('location','Ville / zone',s.location||'Dakar')}${input('phone','Téléphone',s.phone||'')}${select('active','Statut',[{value:'true',label:'Active'},{value:'false',label:'Inactive'}],String(s.active!==false))}</form>`,`${btn('Annuler','close-modal')}${btn('Enregistrer la boutique','save-shop','primary')}`)}

function openSale(){if(db.currentShopId==='all'){toast('Sélectionnez une boutique précise avant d’enregistrer une vente.',true);return}cart=[];const prods=productsForShop();modal('Nouvelle vente — facture multi-articles','Ajoutez un article au panier, puis recommencez avec chaque référence. Tous les articles seront imprimés sur UNE SEULE facture.',`<div class="notice"><b>Facture multi-articles :</b> choisissez un article, indiquez la quantité, cliquez sur « Ajouter au panier », puis répétez pour les autres articles avant de valider.</div><div class="formgrid">${select('saleProduct','Article à ajouter',prods.map(p=>({value:p.id,label:`${p.name} — stock ${p.stock} — ${money(p.sellPrice)}`})),prods[0]?.id||'')}${input('saleQty','Quantité',1,'number',true,'min="1" step="1"')}${select('saleClient','Client',[{value:'',label:'Client comptoir'},...db.clients.filter(c=>c.shopId===db.currentShopId).map(c=>({value:c.id,label:c.name}))],'')}${select('salePayment','Mode de paiement',[{value:'Espèces',label:'Espèces'},{value:'Wave',label:'Wave'},{value:'Orange Money',label:'Orange Money'},{value:'Virement',label:'Virement'},{value:'Crédit',label:'Crédit'}],'Espèces')}</div><div class="toolbar" style="margin-top:13px">${btn('＋ Ajouter cet article au panier','cart-add','')}</div><div id="cartLines" style="margin-top:10px"></div><div class="totals"><div class="totalrow"><span>Nombre de références</span><b id="cartCount">0</b></div><div class="totalrow"><span>Sous-total</span><b id="cartSubtotal">0 FCFA</b></div><div class="totalrow final"><span>Total à encaisser</span><span id="cartTotal">0 FCFA</span></div></div>`,`${btn('Annuler','close-modal')}${btn('Valider la vente et créer la facture','finish-sale','primary')}`);drawCart()}
function drawCart(){const box=$('cartLines');if(!box)return;box.innerHTML=cart.length?cart.map((x,i)=>`<div class="cartrow"><div><b>${esc(x.name)}</b><span class="sub">${money(x.price)} / unité</span></div><div style="text-align:right"><b>${money(x.price*x.qty)}</b><div class="qty"><button data-cart-minus="${i}">−</button><span>${x.qty}</span><button data-cart-plus="${i}">+</button><button class="btn small danger" data-cart-remove="${i}">×</button></div></div></div>`).join(''):'<div class="empty">Le panier est vide. Choisissez un article puis cliquez sur « Ajouter au panier ».</div>';const total=cart.reduce((a,x)=>a+x.price*x.qty,0);if($('cartSubtotal'))$('cartSubtotal').textContent=money(total);if($('cartTotal'))$('cartTotal').textContent=money(total);if($('cartCount'))$('cartCount').textContent=cart.length+' référence(s) / '+cart.reduce((a,x)=>a+x.qty,0)+' unité(s)';box.querySelectorAll('[data-cart-minus]').forEach(b=>b.onclick=()=>{const x=cart[+b.dataset.cartMinus];x.qty--;if(x.qty<=0)cart.splice(+b.dataset.cartMinus,1);drawCart()});box.querySelectorAll('[data-cart-plus]').forEach(b=>b.onclick=()=>{const x=cart[+b.dataset.cartPlus],p=db.products.find(p=>p.id===x.productId);if(x.qty>=stockQty(p)){toast('Stock insuffisant.',true);return}x.qty++;drawCart()});box.querySelectorAll('[data-cart-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.cartRemove,1);drawCart()})}

</style></head><body><main class="sheet"><header class="top"><div class="company"><div class="label">Facturé par</div><h1>${esc(db.company.name||shop?.name||'Votre entreprise')}</h1><p>${esc(shop?.name||'')}</p><p>${esc(db.company.address||shop?.location||'')}</p><p>${db.company.phone?'Tél. : '+esc(db.company.phone):''}</p><p>${db.company.ninea?'NINEA : '+esc(db.company.ninea):''}${db.company.rccm?' · RCCM : '+esc(db.company.rccm):''}</p></div><div class="invoice-title"><div class="label">Document commercial</div><h2>FACTURE</h2><p><strong>${esc(s.ref||'')}</strong></p><p>Date : ${esc((s.date||'').replace('T',' ').slice(0,16))}</p><p>Statut : ${esc(s.status||'Payée')}</p></div></header><section class="details"><div class="detailbox"><h3>Client</h3><p><strong>${esc(s.clientName||'Client comptoir')}</strong></p>${s.clientPhone?`<p>Tél. : ${esc(s.clientPhone)}</p>`:''}${s.clientAddress?`<p>${esc(s.clientAddress)}</p>`:''}</div><div class="detailbox"><h3>Règlement</h3><p>Mode : <strong>${esc(s.payment||'Espèces')}</strong></p><p>Boutique : ${esc(shop?.name||'')}</p><p>Référence : ${esc(s.ref||'')}</p></div></section><h3 class="items-title">Détail des articles (${items.length} référence(s))</h3><table class="items"><thead><tr><th>N°</th><th>Désignation</th><th>Qté</th><th>Prix unitaire</th><th>Montant</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Aucun article enregistré sur cette vente.</td></tr>'}</tbody></table><section class="summary"><div class="line"><span>Nombre de références</span><strong>${items.length}</strong></div><div class="line"><span>Quantité totale</span><strong>${items.reduce((a,i)=>a+Number(i.qty||0),0)}</strong></div><div class="line grand"><span>TOTAL À PAYER</span><span>${money(s.total)}</span></div></section><div class="footer"><p class="thanks">Merci pour votre confiance !</p><p class="footnote">Facture générée par GESCOM NOVA PRO · Conservez ce document pour vos références.</p></div></main><div class="printbar"><button onclick="window.prin function exportCSV(){const rows=[['Référence','Date','Boutique','Client','Total FCFA','Paiement'],...salesScope().map(s=>[s.ref,s.date,currentShop()?.name||'',s.clientName||'Client comptoir',s.total,s.payment])];const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');download('gescom-ventes.csv','\ufeff'+csv,'text/csv;charset=utf-8')}

function wirePage(){const search=$('tableSearch');if(search)search.oninput=e=>{const pos=e.target.selectionStart;searchTerm=e.target.value;const old=activePage;renderPage();const n=$('tableSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}};$('pagecontent').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('pagecontent').querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>openProduct(db.products.find(p=>p.id===b.dataset.editProduct)||{}));$('pagecontent').querySelectorAll('[data-del-product]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cet article ?')){db.products=db.products.filter(p=>p.id!==b.dataset.delProduct);audit('Suppression article',b.dataset.delProduct);renderPage()}});$('pagecontent').querySelectorAll('[data-del-client]').forEach(b=>b.onclick=()=>{db.clients=db.clients.filter(x=>x.id!==b.dataset.delClient);audit('Suppression client');renderPage()});$('pagecontent').querySelectorAll('[data-del-supplier]').forEach(b=>b.onclick=()=>{db.suppliers=db.suppliers.filter(x=>x.id!==b.dataset.delSupplier);audit('Suppression fournisseur');renderPage()});$('pagecontent').querySelectorAll('[data-edit-shop]').forEach(b=>b.onclick=()=>openShop(db.shops.find(s=>s.id===b.dataset.editShop)||{}));$('pagecontent').querySelectorAll('[data-toggle-user]').forEach(b=>b.onclick=()=>{const u=db.users.find(x=>x.id===b.dataset.toggleUser);if(u){u.active=u.active===false;save();audit('Modification accès',u.email);renderPage()}});$('pagecontent').querySelectorAll('[data-invoice]').forEach(b=>b.onclick=()=>{const s=db.sales.find(s=>s.id===b.dataset.invoice);if(s)invoice(s)});$('pagecontent').querySelectorAll('[data-del-purchase]').forEach(b=>b.onclick=()=>cancelPurchase(b.dataset.delPurchase));const restore=$('restoreBtn');if(restore)restore.onclick=()=>$('restoreFile').click();const rf=$('restoreFile');if(rf)rf.onchange=async()=>{const f=rf.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.shops||!d.products||!d.sales)throw new Error('Format de sauvegarde invalide');if(confirm('Remplacer toutes les données locales par cette sauvegarde ?')){db=d;save();shell()}}catch(e){toast(e.message,true)}}}
function action(a){switch(a){case'new-product':openProduct();break;case'new-client':openContact('client');break;case'new-supplier':openContact('supplier');break;case'new-shop':openShop();break;case'new-user':openUser();break;case'new-sale':if(!productsForShop().length){toast('Ajoutez d’abord des articles.',true);return}openSale();break;case'new-purchase':if(!productsForShop().length){toast('Ajoutez d’abord des articles.',true);return}openPurchase();break;case'new-transfer':openTransfer();break;case'new-cash':openCash();break;case'close-modal':closeModal();break;case'save-product':saveProduct();break;case'save-client':saveContact('client');break;case'save-fournisseur':saveContact('supplier');break;case'save-shop':saveShop();break;case'save-user':saveUser();break;case'cart-add':cartAdd();break;case'finish-sale':finishSale();break;case'save-purchase':savePurchase();break;case'save-transfer':saveTransfer();break;case'save-cash':saveCash();break;case'save-api':db.apiUrl=$('apiUrl').value.trim().replace(/\/$/,'');db.tenantId=$('tenantId').value.trim()||db.tenantId;save();toast('Configuration API enregistrée.');break;case'test-api':testAPI();break;case'push-sync':syncCloud('push');break;case'pull-sync':syncCloud('pull');break;case'backup':backup();break;case'export-csv':exportCSV();break;case'save-settings':saveSettings();break;case'reset-data':if(confirm('ATTENTION : supprimer toutes les données locales ?')){db=defaultDB();save();shell();toast('Données locales réinitialisées.')}break}}
function saveProduct(){const f=$('productForm');if(!f||!f.reportValidity())return;const d=getForm(),old=db.products.find(p=>p.id===editing);const p={id:editing||uid(),shopId:old?.shopId||(db.currentShopId==='all'?(db.shops[0]?.id||'shop-main'):db.currentShopId),name:d.name,sku:d.sku,category:d.category,buyPrice:Number(d.buyPrice),sellPrice:Number(d.sellPrice),stock:Number(d.stock),alertAt:Number(d.alertAt),updatedAt:now()};if(old)Object.assign(old,p);else db.products.push(p);save();audit(old?'Modification article':'Création article',p.name);closeModal();renderPage();toast('Article enregistré.')}
function saveContact(type){const f=$('contactForm');if(!f||!f.reportValidity())return;const d=getForm(),arr=type==='client'?db.clients:db.suppliers,old=arr.find(x=>x.id===editing),obj={id:editing||uid(),shopId:old?.shopId||db.currentShopId,name:d.name,phone:d.phone,email:d.email,address:d.address,...(type==='client'?{balance:Number(d.balance||0)}:{})};if(old)Object.assign(old,obj);else arr.push(obj);save();audit(type==='client'?'Création client':'Création fournisseur',obj.name);closeModal();renderPage();toast('Enregistrement réussi.')}
function saveShop(){const f=$('shopForm');if(!f||!f.reportValidity())return;const d=getForm(),old=db.shops.find(s=>s.id===editing),obj={id:editing||uid(),name:d.name,location:d.location,phone:d.phone,active:d.active==='true',createdAt:old?.createdAt||now()};if(old)Object.assign(old,obj);else db.shops.push(obj);save();audit('Configuration boutique',obj.name);closeModal();shell();toast('Boutique enregistrée.')}
function saveUser(){const f=$('userForm');if(!f||!f.reportValidity())return;const d=getForm();if(db.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase())){toast('Cet identifiant existe déjà.',true);return}db.users.push({id:uid(),name:d.name,email:d.email,password:d.password,role:d.role,shopId:d.shopId,active:true});save();audit('Création utilisateur',d.email);closeModal();renderPage();toast('Compte local créé.')}
function cartAdd(){const id=$('f_saleProduct')?.value,qty=Number($('f_saleQty')?.value||0),p=db.products.find(x=>x.id===id);if(!p||qty<1||!Number.isInteger(qty)){toast('Choisissez un article et une quantité valide.',true);return}const already=cart.find(x=>x.productId===id)?.qty||0;if(already+qty>stockQty(p)){toast('Stock insuffisant pour cette quantité.',true);return}const row=cart.find(x=>x.productId===id);if(row)row.qty+=qty;else cart.push({productId:p.id,name:p.name,qty,price:Number(p.sellPrice),buyPrice:Number(p.buyPrice)});drawCart()}
function finishSale(){if(!cart.length){toast('Le panier est vide.',true);return}for(const i of cart){const p=db.products.find(p=>p.id===i.productId);if(!p||p.stock<i.qty){toast('Stock insuffisant : '+i.name,true);return}}const client=db.clients.find(c=>c.id===$('f_saleClient')?.value);const sale={id:uid(),ref:'VTE-'+Date.now().toString().slice(-8),shopId:db.currentShopId,date:now(),clientId:client?.id||'',clientName:client?.name||'Client comptoir',payment:$('f_salePayment')?.value||'Espèces',status:'Payée',items:cart.map(i=>({...i})),total:cart.reduce((a,i)=>a+i.price*i.qty,0)};cart.forEach(i=>{const p=db.products.find(p=>p.id===i.productId);p.stock-=i.qty;p.updatedAt=now()});db.sales.push(sale);if(sale.payment!=='Crédit')db.cash.push({id:uid(),shopId:db.currentShopId,date:now(),type:'Entrée',label:'Vente '+sale.ref,amount:sale.total,method:sale.payment,linkedSaleId:sale.id});save();audit('Vente enregistrée',sale.ref+' — '+money(sale.total));closeModal();renderPage();toast('Vente enregistrée, stock mis à jour.');setTimeout(()=>{if(confirm('Voulez-vous ouvrir la facture '+sale.ref+' ?'))invoice(sale)},250)}
function savePurchase(){const d=getForm(),p=db.products.find(x=>x.id===d.purchaseProduct),supplier=db.suppliers.find(x=>x.id===d.purchaseSupplier),qty=Number(d.purchaseQty),price=Number(d.purchasePrice);if(!p||!Number.isInteger(qty)||qty<1||price<0){toast('Vérifiez l’article, la quantité et le prix.',true);return}const item={productId:p.id,name:p.name,qty,price,buyPrice:price};const purchase={id:uid(),ref:'ACH-'+Date.now().toString().slice(-8),shopId:db.currentShopId,supplierId:supplier?.id||'',supplierName:supplier?.name||'Fournisseur non précisé',date:now(),items:[item],total:qty*price};p.stock=Number(p.stock)+qty;p.buyPrice=price;db.purchases.push(purchase);save();audit('Achat enregistré',purchase.ref);closeModal();renderPage();toast('Achat enregistré, stock augmenté.')}
function cancelPurchase(id){const p=db.purchases.find(x=>x.id===id);if(!p)return;if(!confirm('Annuler cet achat et retirer la quantité du stock ?'))return;for(const i of p.items){const product=db.products.find(x=>x.id===i.productId);if(product&&product.stock<i.qty){toast('Impossible : une partie du stock a déjà été vendue ou retirée.',true);return}}p.items.forEach(i=>{const product=db.products.find(x=>x.id===i.productId);if(product)product.stock-=i.qty});db.purchases=db.purchases.filter(x=>x.id!==id);save();audit('Annulation achat',p.ref);renderPage()}
function saveTransfer(){const d=getForm(),p=db.products.find(x=>x.id===d.transferProduct),qty=Number(d.transferQty),from=db.shops.find(s=>s.id===d.fromShop),to=db.shops.find(s=>s.id===d.toShop);if(!p||!from||!to||from.id===to.id||!Number.isInteger(qty)||qty<1){toast('Vérifiez les boutiques, l’article et la quantité.',true);return}if(p.shopId!==from.id){toast('L’article sélectionné ne dépend pas de la boutique de départ.',true);return}if(p.stock<qty){toast('Stock insuffisant dans la boutique de départ.',true);return}p.stock-=qty;let dest=db.products.find(x=>x.shopId===to.id&&x.sku&&x.sku===p.sku);if(!dest)dest=db.products.find(x=>x.shopId===to.id&&x.name.toLowerCase()===p.name.toLowerCase());if(dest)dest.stock+=qty;else db.products.push({...p,id:uid(),shopId:to.id,stock:qty,createdFromTransfer:true});db.transfers.push({id:uid(),ref:'TRF-'+Date.now().toString().slice(-7),fromShop:from.id,toShop:to.id,productId:p.id,productName:p.name,qty,date:now(),status:'Transféré'});save();audit('Transfert de stock',`${p.name} × ${qty} vers ${to.name}`);closeModal();renderPage();toast('Transfert effectué.')}
function saveCash(){const f=$('cashForm');if(!f||!f.reportValidity())return;const d=getForm();if(Number(d.amount)<=0){toast('Le montant doit être supérieur à zéro.',true);return}db.cash.push({id:uid(),shopId:db.currentShopId,date:now(),type:d.type,amount:Number(d.amount),label:d.label,method:d.method});save();audit('Mouvement de caisse',d.type+' '+money(d.amount));closeModal();renderPage();toast('Mouvement enregistré.')}
function saveSettings(){const name=$('f_companyName')?.value.trim();if(!name){toast('Le nom de l’entreprise est obligatoire.',true);return}db.company.name=name;db.company.owner=$('f_owner').value.trim();db.company.phone=$('f_phone').value.trim();db.company.currency=$('f_currency').value;save();audit('Modification paramètres');shell();toast('Paramètres enregistrés.')}
async function testAPI(){const url=db.apiUrl;if(!url){toast('Enregistrez d’abord l’URL API.',true);return}const out=$('syncResult');out.textContent='Test en cours…';try{const r=await fetch(url.replace(/\/$/,'')+'/health',{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();out.textContent='Connexion API OK — '+(data.status||'réponse reçue');db.lastSync=now();save()}catch(e){out.textContent='Échec de connexion : '+e.message;toast('API non joignable. Vérifiez le déploiement Cloudflare.',true)}}
async function syncCloud(mode){const url=(db.apiUrl||'').replace(/\/$/,'');const tenantId=( $('tenantId')?.value || db.tenantId || '').trim();if(!url||!tenantId){toast('Renseignez l’URL API et l’identifiant entreprise.',true);return}db.apiUrl=url;db.tenantId=tenantId;save();const out=$('syncResult');if(out)out.textContent='Synchronisation en cours…';try{let response;if(mode==='push'){if(!confirm('Envoyer la sauvegarde locale complète vers Neon pour cet identifiant entreprise ? Cela remplacera la sauvegarde cloud existante.'))return;response=await fetch(url+'/sync',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenantId,data:db})})}else{if(!confirm('Restaurer la sauvegarde cloud et remplacer les données locales de cet appareil ? Exportez d’abord une sauvegarde si nécessaire.'))return;response=await fetch(url+'/sync?tenantId='+encodeURIComponent(tenantId),{headers:{'Accept':'application/json'}})}const data=await response.json().catch(()=>({error:'Réponse serveur invalide'}));if(!response.ok||!data.ok&&mode==='push'||mode==='pull'&&data.error)throw new Error(data.error||('HTTP '+response.status));if(mode==='pull'){if(!data.data){toast('Aucune sauvegarde cloud pour cet identifiant.',true);if(out)out.textContent='Aucune sauvegarde trouvée.';return}const pulled=data.data;db={...defaultDB(),...pulled,tenantId,apiUrl:url};if(!Array.isArray(db.shops)||!Array.isArray(db.products)||!Array.isArray(db.sales))throw new Error('Données cloud invalides.');save();activePage='dashboard';shell();toast('Sauvegarde cloud restaurée.')}else{db.lastSync=new Date().toLocaleString('fr-FR');save();toast('Sauvegarde envoyée vers Neon.')}if(out)out.textContent='Dernière opération réussie : '+new Date().toLocaleString('fr-FR')}catch(e){if(out)out.textContent='Échec : '+e.message;toast('Synchronisation échouée : '+e.message,true)}}
function renderLogin(){if(!showLogin){shell();return}$('app').innerHTML=`<div class="login-wrap"><div class="login-card"><div class="login-logo"><div class="brandmark">N</div><div><strong>GESCOM NOVA</strong><small class="muted" style="display:block">Gestion multiboutique professionnelle</small></div></div><h1>Connexion</h1><p>Connectez-vous à votre espace sur cet appareil.</p><form id="loginForm">${input('loginEmail','Identifiant / e-mail','admin@gescom.local','text',true)}${input('loginPassword','Mot de passe','admin123','password',true)}<button class="btn primary" style="width:100%;margin-top:8px">Se connecter</button></form><p class="smallnote" style="margin-top:17px">Première ouverture locale : admin@gescom.local / admin123. Changez ce mot de passe avant tout usage réel. Ce compte local n’est pas un compte Cloud synchronisé.</p><button class="linkbtn" id="backApp">Retour à l’application</button></div></div>`;$('loginForm').onsubmit=e=>{e.preventDefault();const email=$('f_loginEmail').value.toLowerCase(),pw=$('f_loginPassword').value,u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===pw&&x.active!==false);if(!u){toast('Identifiants incorrects ou compte désactivé.',true);return}db.currentUserId=u.id;if(u.shopId!=='all')db.currentShopId=u.shopId;showLogin=false;save();audit('Connexion',u.email);shell()};$('backApp').onclick=()=>{showLogin=false;shell()}}
function init(){db=safeLoad();if(!db.currentUserId||!db.users.some(u=>u.id===db.currentUserId))db.currentUserId=db.users[0]?.id;const errors=(msg)=>{const el=$('pagecontent');if(el)el.innerHTML=`<div class="card"><h2>Erreur GESCOM NOVA</h2><p>Le module a rencontré un problème.</p><pre style="white-space:pre-wrap">${esc(msg)}</pre><button class="btn primary" onclick="location.reload()">Recharger</button></div>`};window.addEventListener('error',e=>{console.error(e.error||e.message);errors(e.message||'Erreur inconnue')});window.addEventListener('unhandledrejection',e=>{console.error(e.reason);errors(e.reason?.message||String(e.reason))});shell()}
init();
})();
